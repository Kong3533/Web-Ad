
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iPhone Duo Advertisement</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    height: 100vh;
}

.frame {
    width: 970px;
    height: 250px;
    border: solid 1px gray;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: radial-gradient(circle at center, #343b4b, #08090d);
    color: white;
    font-family: 'Inter', sans-serif;
    padding: 20px;
    box-sizing: border-box;
}

.content {
    width: 55%;
}

h1 {
    font-size: 48px;
    margin: 0 0 5px;
    letter-spacing: -3px;
}

h2 {
    font-size: 19px;
    font-weight: 400;
    color: #c4d4f0;
    margin: 0 0 12px;
}

p {
    font-size: 12px;
    line-height: 1.5;
    color: #c3c9d5;
    margin-bottom: 15px;
}

.button {
    display: inline-block;
    background: white;
    color: #111827;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

.button:hover {
    background: #c4d4f0;
}

.product-image {
    width: 40%;
    height: 210px;
    object-fit: contain;
}

.small-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #9eb8e5;
    margin-bottom: 8px;
}

</style>
</head>

<body>

<div class="frame">

    <div class="content">

        <div class="small-label">
            INTRODUCING THE FUTURE
        </div>

        <h1>iPhone Duo.</h1>

        <h2>Two Views. One Experience.</h2>

        <p>
            Your world just got bigger. Experience a new
            way to connect, create, and explore with the
            foldable iPhone.
        </p>

        <a class="button"
           href="https://www.apple.com/iphone/"
           target="_blank">
            EXPLORE NOW ↗
        </a>

    </div>

    <img
        class="product-image"
        src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600"
        alt="Smartphone product image"
    >

</div>

</body>
</html>
